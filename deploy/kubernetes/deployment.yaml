apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-manager-api
  labels:
    app.kubernetes.io/name: library-manager
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: library-manager
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: library-manager
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: library-manager-api
          image: library-manager-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: Testing__UseTestAuth
              value: "false"
            - name: Database__ApplyMigrations
              value: "false"
          envFrom:
            - configMapRef:
                name: library-manager-api
            - secretRef:
                name: library-manager-api
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
